<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Gran GIOIA Timecard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        /* 全体レイアウト */
        body { font-family: "Yu Mincho", "MS PMincho", serif; background: #1a1a1a; color: #f1d592; text-align: center; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; position: relative; }
        .container { border: 2px solid #f1d592; padding: 40px 30px; border-radius: 15px; max-width: 400px; width: 90%; background: rgba(0, 0, 0, 0.8); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        /* 登録ボタン：左上に控えめに「ミニマル」に配置 */
        .reg-btn { position: fixed; top: 15px; left: 15px; background: transparent; border: 1px solid #444; color: #888; padding: 5px 12px; border-radius: 4px; cursor: pointer; font-size: 11px; transition: 0.3s; z-index: 100; letter-spacing: 0.05em; }
        .reg-btn:hover { border-color: #f1d592; color: #f1d592; background: rgba(241, 213, 146, 0.05); }

        /* モーダル（登録画面） */
        #reg-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; overflow-y: auto; padding: 20px 0; }
        .modal-content { background: #222; border: 1px solid #f1d592; width: 95%; max-width: 500px; margin: auto; padding: 30px; border-radius: 15px; text-align: left; }
        
        h2 { letter-spacing: 0.2em; margin-bottom: 20px; line-height: 1.5; }
        h3 { color: #f1d592; border-bottom: 1px solid #444; padding-bottom: 10px; margin-top: 0; text-align: center; }
        
        .desc-text { font-size: 11px; color:#ccc; line-height:1.6; margin: 15px 0; }
        .desc-highlight { color: #f1d592; font-weight: bold; }
        
        label { font-size: 11px; color: #f1d592; margin-top: 12px; display: block; letter-spacing: 0.05em; }
        .label-note { font-size: 9px; color: #ff4d4d; margin-left: 5px; font-weight: normal; }

        input, select, button { width: 100%; padding: 14px; margin: 6px 0; border-radius: 8px; border: 1px solid #444; background: #333; color: #fff; box-sizing: border-box; font-size: 16px; outline: none; }
        input:focus, select:focus { border-color: #f1d592; }

        /* マイナンバー画面秘匿化 */
        .mask-input { -webkit-text-security: disc; }

        .btn-in { background: #f1d592; color: #1a1a1a; font-weight: bold; border: none; cursor: pointer; padding: 18px; margin-top: 15px; }
        .btn-out { background: transparent; color: #f1d592; border: 1px solid #f1d592; cursor: pointer; }
        .btn-close { background: #444; border: none; color: #ccc; cursor: pointer; margin-top: 10px; padding: 10px; font-size: 14px; }
        
        .flex { display: flex; gap: 10px; }
        .flex div { flex: 1; }

        /* パネル制御 */
        #punch-elements, #error-panel, #warning-panel { display: none; }
        #warning-panel { color: #ff4d4d; border: 1px dashed #ff4d4d; padding: 20px; border-radius: 10px; font-size: 14px; line-height: 1.6; margin-top: 10px; }
        #error-panel { color: #ff4d4d; border: 1px solid #ff4d4d; padding: 20px; border-radius: 10px; margin-top: 20px; }
        .forgot-warning { background: #851414; color: white; padding: 12px; border-radius: 8px; font-size: 0.85em; margin-bottom: 15px; display: none; line-height: 1.4; }
        
        #status { margin-top: 20px; font-size: 13px; color: #888; min-height: 3em; line-height: 1.6; }
        
        /* 固定配置のビルドインフォ（右下） */
        .build-info { position: fixed; bottom: 10px; right: 15px; font-size: 10px; color: #444; text-align: right; font-family: monospace; line-height: 1.4; z-index: 100; pointer-events: none; }
        .loading { animation: blink 1s infinite; } @keyframes blink { 50% { opacity: 0.5; } }
    </style>
</head>
<body>

    <button class="reg-btn" onclick="openModal()">＋ 新規スタッフ登録</button>

    <div class="container">
        <h2>Gran GIOIA</h2>

        <div id="punch-panel">
            <div id="punch-loading" class="loading" style="font-size: 14px; color:#666; margin: 20px 0;">ネットワーク認証中...</div>
            
            <div id="punch-elements">
                <div id="forgotWarning" class="forgot-warning">⚠️ 前回、退勤の打刻忘れがありました。<br>今後は注意してください。</div>
                <select id="nameList" onchange="checkUserStatus()">
                    <option value="">名前を選択してください</option>
                </select>
                <button class="btn-in" onclick="punch('出勤')">出 勤</button>
                <button class="btn-out" onclick="punch('退勤')">退 勤</button>
            </div>

            <div id="warning-panel">
                ⚠️ 店舗ネットワーク外です。<br>打刻の際は店舗のWi-Fiに接続してください。
            </div>
        </div>

        <div id="error-panel">
            <div id="displayDate" style="font-weight:bold; margin-bottom:10px; font-size:1.1em;"></div>
            <p style="font-size:0.85em; color:#ccc; line-height:1.5;">本日の出勤記録が見つかりません。<br>実際の出勤時刻を入力して申請してください。</p>
            <input type="time" id="missedTime">
            <button id="reqBtn" class="btn-in" onclick="sendApproval()">管理者へ申請</button>
        </div>

        <div id="status"></div>
    </div>

    <div id="reg-modal">
        <div class="modal-content">
            <h3>スタッフ新規登録</h3>
            <hr style="border:0; border-top:1px solid #444;">
            
            <p class="desc-text">※全ての項目を正確に入力してください。</p>
            <p class="desc-text desc-highlight">
                最寄り駅からの交通費（往復）ICカード利用時の料金をお調べください。<br>
                お手元にマイナンバーカードをご用意の上、下記の入力を開始してください。
            </p>
            
            <div class="flex">
                <div><label>姓</label><input type="text" id="lastName" placeholder="田中"></div>
                <div><label>名</label><input type="text" id="firstName" placeholder="太郎"></div>
            </div>
            
            <label>ヨミ（カタカナ）</label><input type="text" id="yomi" placeholder="タナカ タロウ">
            
            <label>郵便番号</label><input type="text" id="zipcode" placeholder="123-4567">
            <label>住所</label><input type="text" id="address" placeholder="東京都中央区銀座...">
            
            <label>電話番号</label><input type="tel" id="tel" placeholder="09012345678">
            <label>E-mail</label><input type="email" id="email" placeholder="example@gioia.page">
            
            <label>生年月日（西暦）</label>
            <div class="flex">
                <div><select id="birthYear"></select></div>
                <div><select id="birthMonth"></select></div>
                <div><select id="birthDay"></select></div>
            </div>
            
            <label>自宅からの最寄り駅</label><input type="text" id="station" placeholder="銀座駅">
            
            <div class="flex">
                <div><label>交通費（往復IC）</label><input type="number" id="ic_fare" placeholder="400"></div>
                <div><label>交通費（定期代）</label><input type="number" id="pass_fare" placeholder="5000"></div>
            </div>
            
            <hr style="border:0; border-top:1px solid #444; margin:20px 0;">
            
            <label>緊急連絡先（氏名）<span class="label-note">※よほどのことがない限りコチラから連絡することはございません</span></label>
            <input type="text" id="em_name">
            
            <label>緊急連絡先（ヨミ）</label><input type="text" id="em_yomi">
            
            <label>緊急連絡先（電話）</label><input type="tel" id="em_tel" placeholder="09011112222">
            
            <label>関係性</label><input type="text" id="em_rel" placeholder="配偶者">
            
            <label>マイナンバー（12桁）</label>
            <input type="text" id="mynumber" class="mask-input" maxlength="12" placeholder="数字12桁を入力" autocomplete="off" inputmode="numeric">
            
            <button class="btn-in" onclick="submitRegistration()" id="regSubmitBtn">登録を実行する</button>
            <button class="btn-close" onclick="closeModal()">キャンセル</button>
        </div>
    </div>

    <div class="build-info">
        GITHUB: v1.1.9<br>
        GAS: <span id="gas-build">---</span>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyzOY0K5lid7GwgAhhHoK_BVWAwvJeFjS40nNUZ6TMPlyuPJF2NkvAlQhKS1w3bJvhT/exec";
        let userIp = "";
        let targetRow = "";
        let lastRec = null;

        window.onload = function() {
            const now = new Date();
            document.getElementById('displayDate').innerText = now.getFullYear() + "年" + (now.getMonth() + 1) + "月" + now.getDate() + "日";
            
            initBirthdayDropdown();
            initZipcodeAutocomplete(); // 郵便番号自動入力リスナーの起動

            fetch('https://api.ipify.org?format=json').then(res => res.json()).then(data => {
                userIp = data.ip;
                return fetch(GAS_URL + "?ip=" + userIp);
            }).then(res => res.json()).then(res => {
                document.getElementById('punch-loading').style.display = 'none';
                document.getElementById('gas-build').innerText = res.build;
                
                const nameSelect = document.getElementById('nameList');
                nameSelect.innerHTML = '<option value="">名前を選択してください</option>';
                res.staffList.forEach(function(staffName) {
                    const opt = new Option(staffName, staffName);
                    nameSelect.appendChild(opt);
                });

                if (res.allowed) {
                    document.getElementById('punch-elements').style.display = 'block';
                } else {
                    document.getElementById('warning-panel').style.display = 'block';
                }
            }).catch(() => { 
                document.getElementById('punch-loading').innerText = "通信エラー (打刻機能ロック)"; 
            });
        };

        // 【新機能】郵便番号自動住所補完ロジック
        function initZipcodeAutocomplete() {
            document.getElementById('zipcode').addEventListener('input', function() {
                const zip = this.value.replace(/-/g, '').trim(); // ハイフンを自動除去
                if (zip.length === 7 && !isNaN(zip)) {
                    const addressInput = document.getElementById('address');
                    addressInput.placeholder = "住所を検索中...";
                    
                    // クリーンな無料API「zipcloud」を使用して住所情報を高速検索
                    fetch('https://zipcloud.ibsnet.co.jp/api/search?zipcode=' + zip)
                    .then(res => res.json())
                    .then(res => {
                        if (res.status === 200 && res.results) {
                            const result = res.results[0];
                            // 都道府県 + 市区町村 + 町域名 をガッチャンコして代入
                            addressInput.value = result.address1 + result.address2 + result.address3;
                        } else {
                            addressInput.placeholder = "該当する住所が見つかりません";
                        }
                    })
                    .catch(() => {
                        addressInput.placeholder = "住所の自動取得に失敗しました";
                    });
                }
            });
        }

        function initBirthdayDropdown() {
            const yearSel = document.getElementById('birthYear');
            const monthSel = document.getElementById('birthMonth');
            const daySel = document.getElementById('birthDay');
            const currentYear = new Date().getFullYear();
            for (let y = currentYear; y >= 1950; y--) {
                const opt = new Option(y + "年", y); if (y === 2000) opt.selected = true; yearSel.add(opt);
            }
            for (let m = 1; m <= 12; m++) {
                const opt = new Option(m + "月", m); if (m === 6) opt.selected = true; monthSel.add(opt);
            }
            for (let d = 1; d <= 31; d++) {
                const opt = new Option(d + "日", d); if (d === 15) opt.selected = true; daySel.add(opt);
            }
        }

        function openModal() { document.getElementById('reg-modal').style.display = 'block'; }
        function closeModal() { document.getElementById('reg-modal').style.display = 'none'; }

        function submitRegistration() {
            const btn = document.getElementById('regSubmitBtn');
            const mynumber = document.getElementById('mynumber').value.trim();

            if (mynumber.length !== 12 || isNaN(mynumber)) {
                alert("Error: マイナンバーは12桁の数字で入力してください。");
                return;
            }

            const birthdayStr = document.getElementById('birthYear').value + "-" + 
                                ("0" + document.getElementById('birthMonth').value).slice(-2) + "-" + 
                                ("0" + document.getElementById('birthDay').value).slice(-2);

            const data = {
                action: 'registerStaff',
                lastName: document.getElementById('lastName').value.trim(),
                firstName: document.getElementById('firstName').value.trim(),
                yomi: document.getElementById('yomi').value,
                zipcode: document.getElementById('zipcode').value,
                address: document.getElementById('address').value,
                tel: document.getElementById('tel').value,
                email: document.getElementById('email').value,
                birthday: birthdayStr,
                station: document.getElementById('station').value,
                ic_fare: document.getElementById('ic_fare').value,
                pass_fare: document.getElementById('pass_fare').value,
                em_name: document.getElementById('em_name').value,
                em_yomi: document.getElementById('em_yomi').value,
                em_tel: document.getElementById('em_tel').value,
                em_rel: document.getElementById('em_rel').value,
                mynumber: mynumber
            };

            if(!data.lastName || !data.firstName) { alert("姓名は必須入力です。"); return; }
            if(!confirm(data.lastName + " " + data.firstName + " さんを登録しますか？")) return;

            btn.disabled = true; btn.innerText = "登録中...";
            
            fetch(GAS_URL, { method: 'POST', body: JSON.stringify(data) })
            .then(res => res.json())
            .then(res => {
                if(res.success) { alert("完了しました。"); location.reload(); }
                else { alert("登録失敗。既に同名のスタッフが既に存在する可能性があります。"); btn.disabled = false; btn.innerText = "登録を実行する"; }
            }).catch(() => { alert("通信エラーが発生しました。"); btn.disabled = false; btn.innerText = "登録を実行する"; });
        }

        function checkUserStatus() {
            const name = document.getElementById('nameList').value;
            const statusEl = document.getElementById('status');
            const warningEl = document.getElementById('forgotWarning');
            if (!name) { statusEl.innerText = ""; warningEl.style.display = 'none'; return; }

            statusEl.innerText = "状態確認中...";
            fetch(GAS_URL + "?ip=" + userIp + "&name=" + encodeURIComponent(name))
            .then(res => res.json())
            .then(res => {
                lastRec = res.lastRecord;
                warningEl.style.display = res.forgotOut ? 'block' : 'none';
                if (lastRec) {
                    let txt = "【直近の記録】<br>出勤: " + (lastRec.in || "--:--") + (lastRec.out ? " / 退勤: " + lastRec.out : "");
                    statusEl.innerHTML = txt;
                } else { statusEl.innerText = "直近の打刻はありません"; }
            });
        }

        function punch(type) {
            const name = document.getElementById('nameList').value;
            if (!name) { alert("名前を選択してください"); return; }
            let isUpdate = false;
            let targetUpdateRow = null;

            if (lastRec) {
                if (type === '出勤' && lastRec.isIncomplete) {
                    if (!confirm(lastRec.in + " に打刻済みですが、現在の時刻で更新しますか？")) return;
                    isUpdate = true; targetUpdateRow = lastRec.row;
                } else if (type === '退勤' && !lastRec.isIncomplete) {
                    if (!confirm(lastRec.out + " に退勤済みですが、現在の時刻で更新しますか？")) return;
                    isUpdate = true; targetUpdateRow = lastRec.row;
                }
            }

            if (!isUpdate && !confirm(name + "さん、" + type + " を記録しますか？")) return;

            document.getElementById('status').innerText = "送信中...";
            fetch(GAS_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'punch', name: name, type: type, ip: userIp, update: isUpdate, row: targetUpdateRow })
            })
            .then(res => res.json())
            .then(res => {
                if (res.success) { alert("完了しました。"); location.reload(); }
                else if (res.errorType === 'unauthorized_ip') { alert("エラー: 店舗外からの打刻申請はバックエンド側で拒否されました。"); location.reload(); }
                else if (res.errorType === 'no_punch_in') {
                    document.getElementById('punch-elements').style.display = 'none';
                    document.getElementById('error-panel').style.display = 'block';
                    targetRow = res.row;
                }
            }).catch(() => { alert("通信エラーが発生しました。"); });
        }

        function sendApproval() {
            const time = document.getElementById('missedTime').value;
            const name = document.getElementById('nameList').value;
            if (!time) { alert("時刻を入力してください"); return; }
            const btn = document.getElementById('reqBtn');
            btn.disabled = true; btn.innerText = "申請中...";

            fetch(GAS_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify({ action: 'requestApproval', name: name, time: time, date: document.getElementById('displayDate').innerText, row: targetRow })
            }).then(() => {
                alert("管理者に修正依頼を送信しました。\n今後、打刻忘れに注意してください。\nお疲れ様でした。");
                location.reload();
            });
        }
    </script>
</body>
</html>
