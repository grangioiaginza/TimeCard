<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Gran GIOIA Timecard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body { font-family: "Yu Mincho", serif; background: #1a1a1a; color: #f1d592; text-align: center; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { border: 2px solid #f1d592; padding: 40px 30px; border-radius: 15px; max-width: 400px; width: 90%; background: rgba(0, 0, 0, 0.8); }
        .reg-btn { position: fixed; top: 15px; left: 15px; background: transparent; border: 1px solid #444; color: #888; padding: 5px 12px; border-radius: 4px; cursor: pointer; font-size: 11px; z-index: 100; }
        #reg-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; overflow-y: auto; padding: 20px 0; }
        .modal-content { background: #222; border: 1px solid #f1d592; width: 92%; max-width: 500px; margin: auto; padding: 25px 20px; border-radius: 15px; text-align: left; }
        h2 { letter-spacing: 0.2em; }
        h3 { color: #f1d592; border-bottom: 1px solid #444; text-align: center; }
        label { font-size: 11px; color: #f1d592; margin-top: 12px; display: block; }
        input, select, button { width: 100%; padding: 14px; margin: 6px 0; border-radius: 8px; border: 1px solid #444; background: #333; color: #fff; font-size: 16px; outline: none; }
        .btn-in { background: #f1d592; color: #1a1a1a; font-weight: bold; border: none; cursor: pointer; padding: 18px; }
        .btn-close { background: #444; border: none; color: #ccc; cursor: pointer; margin-top: 10px; }
        .flex { display: flex; gap: 10px; } .flex div { flex: 1; }
        .mask-input { -webkit-text-security: disc; }
        .upload-area { background: #1a1a1a; border: 1px dashed #f1d592; padding: 10px; border-radius: 8px; margin-top: 5px; text-align: center; }
        .upload-area span { font-size: 10px; color: #888; }
        .preview-img { width: 100%; height: 100px; object-fit: contain; display: none; margin-top: 5px; border-radius: 4px; }
        #punch-elements, #warning-panel { display: none; }
        #warning-panel { color: #ff4d4d; border: 1px dashed #ff4d4d; padding: 20px; border-radius: 10px; }
        .loading { animation: blink 1s infinite; } @keyframes blink { 50% { opacity: 0.5; } }
    </style>
</head>
<body>

    <button class="reg-btn" onclick="openModal()">＋ 新規スタッフ登録</button>

    <div class="container">
        <h2>Gran GIOIA</h2>
        <div id="punch-panel">
            <div id="punch-loading" class="loading">ネットワーク認証中...</div>
            <div id="punch-elements">
                <select id="nameList" onchange="checkUserStatus()"><option value="">読み込み中...</option></select>
                <button class="btn-in" onclick="punch('出勤')">出 勤</button>
                <button class="btn-out" onclick="punch('退勤')">退 勤</button>
            </div>
            <div id="warning-panel">⚠️ 店舗ネットワーク外です。</div>
        </div>
        <div id="status" style="margin-top:20px; font-size:13px; color:#888;"></div>
    </div>

    <div id="reg-modal">
        <div class="modal-content">
            <h3>スタッフ新規登録</h3>
            <div class="flex">
                <div><label>姓</label><input type="text" id="lastName" placeholder="田中"></div>
                <div><label>名</label><input type="text" id="firstName" placeholder="太郎"></div>
            </div>
            <label>ヨミ（カタカナ）</label><input type="text" id="yomi" placeholder="タナカ タロウ">
            <label>郵便番号</label><input type="text" id="zipcode" placeholder="1234567">
            <label>住所</label><input type="text" id="address">
            <label>電話番号</label><input type="tel" id="tel">
            <label>E-mail</label><input type="email" id="email">
            <label>生年月日</label>
            <div class="flex">
                <div><select id="birthYear"></select></div>
                <div><select id="birthMonth"></select></div>
                <div><select id="birthDay"></select></div>
            </div>
            <label>自宅からの最寄り駅</label><input type="text" id="station" placeholder="銀座駅">
            <hr style="border:0; border-top:1px solid #444; margin:20px 0;">
            
            <label>免許証 (表面)</label>
            <div class="upload-area">
                <input type="file" id="file_licenseF" accept="image/*" onchange="previewAndResize(this, 'prev_licenseF')">
                <span>タップして撮影または選択</span>
                <img id="prev_licenseF" class="preview-img">
            </div>
            <label>免許証 (裏面)</label>
            <div class="upload-area">
                <input type="file" id="file_licenseB" accept="image/*" onchange="previewAndResize(this, 'prev_licenseB')">
                <img id="prev_licenseB" class="preview-img">
            </div>

            <label>マイナンバーカード (表面)</label>
            <div class="upload-area">
                <input type="file" id="file_mynumberF" accept="image/*" onchange="previewAndResize(this, 'prev_mynumberF')">
                <img id="prev_mynumberF" class="preview-img">
            </div>
            <label>マイナンバーカード (裏面)</label>
            <div class="upload-area">
                <input type="file" id="file_mynumberB" accept="image/*" onchange="previewAndResize(this, 'prev_mynumberB')">
                <img id="prev_mynumberB" class="preview-img">
            </div>

            <label>マイナンバー (12桁)</label>
            <input type="text" id="mynumber" class="mask-input" maxlength="12" inputmode="numeric">
            
            <button class="btn-in" onclick="submitRegistration()" id="regSubmitBtn" style="margin-top:30px;">登録を実行する</button>
            <button class="btn-close" onclick="closeModal()">キャンセル</button>
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyzOY0K5lid7GwgAhhHoK_BVWAwvJeFjS40nNUZ6TMPlyuPJF2NkvAlQhKS1w3bJvhT/exec";
        let userIp = "";
        const imageDB = {}; // リサイズ済み画像を一時保管

        window.onload = function() {
            initBirthdayDropdown();
            initZipcodeAutocomplete();
            fetch('https://api.ipify.org?format=json').then(res => res.json()).then(data => {
                userIp = data.ip;
                return fetch(GAS_URL + "?ip=" + userIp);
            }).then(res => res.json()).then(res => {
                document.getElementById('punch-loading').style.display = 'none';
                const nameSelect = document.getElementById('nameList');
                nameSelect.innerHTML = '<option value="">名前を選択してください</option>';
                res.staffList.forEach(n => nameSelect.add(new Option(n, n)));
                if (res.allowed) document.getElementById('punch-elements').style.display = 'block';
                else document.getElementById('warning-panel').style.display = 'block';
            });
        };

        // 画像リサイズ＆プレビュー処理
        function previewAndResize(input, prevId) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 1200; // 最大幅を1200pxに制限して軽量化
                    let width = img.width; let height = img.height;
                    if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.7); // 画質0.7で圧縮
                    document.getElementById(prevId).src = dataUrl;
                    document.getElementById(prevId).style.display = 'block';
                    imageDB[prevId.replace('prev_', '')] = dataUrl;
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function submitRegistration() {
            const lastName = document.getElementById('lastName').value.trim();
            const firstName = document.getElementById('firstName').value.trim();
            const mynumber = document.getElementById('mynumber').value.trim();
            if (!lastName || !firstName || mynumber.length !== 12) { alert("入力不備があります。画像以外の項目は全て必須です。"); return; }
            
            const btn = document.getElementById('regSubmitBtn');
            btn.disabled = true; btn.innerText = "データ送信中（画像がある場合は時間がかかります）...";

            const data = {
                action: 'registerStaff',
                lastName: lastName, firstName: firstName,
                yomi: document.getElementById('yomi').value,
                zipcode: document.getElementById('zipcode').value,
                address: document.getElementById('address').value,
                tel: document.getElementById('tel').value,
                email: document.getElementById('email').value,
                birthday: document.getElementById('birthYear').value + "-" + ("0" + document.getElementById('birthMonth').value).slice(-2) + "-" + ("0" + document.getElementById('birthDay').value).slice(-2),
                station: document.getElementById('station').value,
                mynumber: mynumber,
                images: imageDB // 圧縮済み画像データ
            };

            fetch(GAS_URL, { method: 'POST', body: JSON.stringify(data) })
            .then(res => res.json()).then(res => {
                if(res.success) { alert("登録が完了しました。画像も保存されました。"); location.reload(); }
                else { alert("登録失敗。同名のスタッフがいる可能性があります。"); btn.disabled = false; }
            }).catch(() => { alert("エラーが発生しました。"); btn.disabled = false; });
        }

        function openModal() { document.getElementById('reg-modal').style.display = 'block'; }
        function closeModal() { document.getElementById('reg-modal').style.display = 'none'; }
        function initZipcodeAutocomplete() {
            document.getElementById('zipcode').addEventListener('input', function() {
                const zip = this.value.replace(/-/g, '');
                if (zip.length === 7) {
                    fetch('https://zipcloud.ibsnet.co.jp/api/search?zipcode=' + zip)
                    .then(res => res.json()).then(res => { if(res.results) document.getElementById('address').value = res.results[0].address1 + res.results[0].address2 + res.results[0].address3; });
                }
            });
        }
        function initBirthdayDropdown() {
            const y=document.getElementById('birthYear'), m=document.getElementById('birthMonth'), d=document.getElementById('birthDay');
            for(let i=2010; i>=1950; i--) y.add(new Option(i+"年", i)); y.value="2000";
            for(let i=1; i<=12; i++) m.add(new Option(i+"月", i)); m.value="6";
            for(let i=1; i<=31; i++) d.add(new Option(i+"日", i)); d.value="15";
        }
        function checkUserStatus() { /* 以前と同じ */ }
        function punch(t) { /* 以前と同じ */ }
    </script>
</body>
</html>
