<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Gran GIOIA Timecard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: "Yu Mincho", serif; background: #1a1a1a; color: #f1d592; text-align: center; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { border: 2px solid #f1d592; padding: 40px 30px; border-radius: 15px; max-width: 400px; width: 90%; background: rgba(0, 0, 0, 0.8); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { letter-spacing: 0.2em; margin-bottom: 30px; line-height: 1.5; }
        #main-panel, #warning-panel, #error-panel { display: none; }
        #error-panel { color: #ff4d4d; border: 1px solid #ff4d4d; padding: 20px; border-radius: 10px; margin-top: 20px; text-align: left; }
        select, button, input { width: 100%; padding: 18px; margin: 12px 0; font-size: 18px; border-radius: 8px; box-sizing: border-box; outline: none; }
        select, input { background: #333; color: #fff; border: 1px solid #f1d592; }
        .btn-in { background: #f1d592; color: #1a1a1a; font-weight: bold; border: none; cursor: pointer; }
        .btn-out { background: transparent; color: #f1d592; border: 1px solid #f1d592; cursor: pointer; }
        .btn-send { background: #ff4d4d; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 5px; }
        #status { margin-top: 25px; font-size: 14px; color: #666; }
        .loading { animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }
    </style>
</head>
<body>
    <div class="container">
        <h2>Gran GIOIA</h2>
        <div id="loading-msg" class="loading">認証中...</div>

        <div id="main-panel">
            <select id="nameList">
                <option value="">名前を選択してください</option>
                <option value="スタッフA">スタッフA</option>
                <option value="スタッフB">スタッフB</option>
                <option value="スタッフC">スタッフC</option>
            </select>
            <button class="btn-in" onclick="punch('出勤')">出 勤</button>
            <button class="btn-out" onclick="punch('退勤')">退 勤</button>
        </div>

        <div id="error-panel">
            <p style="font-weight:bold; margin-top:0;">⚠️ 出勤打刻の忘れ</p>
            <p style="font-size:0.8em; color:#ccc;">本日の出勤記録が見つかりません。実際の出勤時刻を入力して申請してください。</p>
            <input type="time" id="missedTime">
            <button class="btn-send" onclick="sendApproval()">管理者へ申請</button>
        </div>

        <div id="warning-panel">
            <p>店舗外アクセスは許可されていません。</p>
        </div>
        <div id="status"></div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzHELuQoFwvJdCQUWMGNx38Z1V3F09q0I9rkjZoL9OJtgcYenE5ijlfdyu5fDtJFND4bw/exec";
        let userIp = "";
        let errorRow = "";

        window.onload = function() {
            fetch('https://api.ipify.org?format=json')
            .then(res => res.json())
            .then(data => {
                userIp = data.ip;
                return fetch(GAS_URL + "?ip=" + userIp);
            })
            .then(res => res.json())
            .then(res => {
                document.getElementById('loading-msg').style.display = 'none';
                if (res.allowed) document.getElementById('main-panel').style.display = 'block';
                else document.getElementById('warning-panel').style.display = 'block';
            });
        };

        function punch(type) {
            const name = document.getElementById('nameList').value;
            if (!name) { alert("名前を選択してください"); return; }
            if (!confirm(name + "さん、" + type + " を記録しますか？")) return;

            document.getElementById('status').innerText = "通信中...";
            
            // fetchの戻り値を確認するためにJSON取得を試みる
            fetch(GAS_URL, {
                method: 'POST',
                // mode: 'no-cors'を外すとエラーハンドリングが可能になります
                body: JSON.stringify({ action: 'punch', name: name, type: type, ip: userIp })
            })
            .then(res => res.json())
            .then(res => {
                if (res.success) {
                    alert("記録完了しました。");
                    location.reload();
                } else if (res.errorType === 'no_punch_in') {
                    document.getElementById('main-panel').style.display = 'none';
                    document.getElementById('error-panel').style.display = 'block';
                    errorRow = res.row;
                }
            })
            .catch(() => {
                // no-cors環境での保険（通常は成功メッセージを表示）
                alert("送信しました。画面を確認してください。");
            });
        }

        function sendApproval() {
            const time = document.getElementById('missedTime').value;
            const name = document.getElementById('nameList').value;
            if (!time) { alert("時刻を入力してください"); return; }

            fetch(GAS_URL, {
                method: 'POST',
                body: JSON.stringify({
                    action: 'requestApproval',
                    name: name,
                    time: time,
                    date: new Date().toLocaleDateString(),
                    row: errorRow
                })
            })
            .then(() => {
                alert("管理者に修正依頼を送信しました。そのまま退店してください。");
                location.reload();
            });
        }
    </script>
</body>
</html>
